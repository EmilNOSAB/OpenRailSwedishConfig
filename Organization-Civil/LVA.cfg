# Local BJP26 LVA libraries, loaded by the Swedish Standards WorkSpace.
# Bentley's stock LVA libraries are not shipped; updates back them up and retire them.
_BJP26_LVA_ROOT = $(CIVIL_ORGANIZATION_ROOT)LVA/

MS_DGNLIBLIST                         > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
CIVIL_CONTENTMANAGEMENTDGNLIBLIST     > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_DGNLIBLIST_ELEMENTTEMPLATES        > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_DGNLIBLIST_LEVELS                  > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_LEVEL_LIB_DIR                     > $(_BJP26_LVA_ROOT)Dgnlib/
MS_DGNLIBLIST_LINESTYLES              > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_DGNLIBLIST_TEXTSTYLES              > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_DGNLIBLIST_DIMENSIONSTYLES         > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_DGNLIBLIST_TEXTFAVORITES           > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_DGNLIBLIST_ITEMTYPES               > $(_BJP26_LVA_ROOT)Dgnlib/*.dgnlib
MS_CELL                              > $(_BJP26_LVA_ROOT)Cell/2D/
MS_CELL                              > $(_BJP26_LVA_ROOT)Cell/3D/
MS_CELLLIST                          > $(_BJP26_LVA_ROOT)Cell/2D/*.cel
MS_CELLLIST                          > $(_BJP26_LVA_ROOT)Cell/3D/*.cel

# Signal is still marked "Arbete pagar" in the source. Enable explicitly to try it.
BJP26_LVA_ENABLE_SIGNAL : 0
%if $(BJP26_LVA_ENABLE_SIGNAL) == 1
  MS_DGNLIBLIST                       > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  CIVIL_CONTENTMANAGEMENTDGNLIBLIST   > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_DGNLIBLIST_ELEMENTTEMPLATES      > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_DGNLIBLIST_LEVELS                > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_LEVEL_LIB_DIR                   > $(_BJP26_LVA_ROOT)Experimental/Signal/
  MS_DGNLIBLIST_LINESTYLES            > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_DGNLIBLIST_TEXTSTYLES            > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_DGNLIBLIST_DIMENSIONSTYLES       > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_DGNLIBLIST_TEXTFAVORITES         > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_DGNLIBLIST_ITEMTYPES             > $(_BJP26_LVA_ROOT)Experimental/Signal/*.dgnlib
  MS_CELL                            > $(_BJP26_LVA_ROOT)Experimental/Signal/
  MS_CELLLIST                        > $(_BJP26_LVA_ROOT)Experimental/Signal/*.cel
%endif

# Source LOI/status workbooks are not shipped or registered as lookup tables.
# No separate NC-OR-ItemTypeLib library is supplied.
