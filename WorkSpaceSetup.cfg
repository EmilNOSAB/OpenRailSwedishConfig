# Swedish Standards Rail - custom OpenRail configuration.
# Add this root folder in OpenRail's Manage Configuration dialog.
# All paths follow the selected configuration, allowing the folder to be moved.

CIVIL_ORGANIZATION_ROOT                   = $(_USTN_CONFIGURATION)Organization-Civil/
_USTN_ORGANIZATION                        = $(_USTN_CONFIGURATION)Organization/
_USTN_WORKSPACESROOT                      = $(_USTN_CONFIGURATION)WorkSpaces/
_USTN_WORKSPACEROOT                       = $(_USTN_WORKSPACESROOT)$(_USTN_WORKSPACENAME)/
_USTN_WORKSPACESTANDARDS                  = $(_USTN_WORKSPACEROOT)Standards/
_USTN_WORKSETSROOT                        = $(_USTN_WORKSPACEROOT)WorkSets/
_USTN_WORKSETSDGNWSROOT                   = $(_USTN_WORKSETSROOT)

# Civil folder structure used when creating WorkSpaces and WorkSets.
_USTN_WORKSPACESTANDARDSUBDIRS            = Cell;Data;Seed;Symb;Macros;Sheet Borders;Superelevation
_USTN_WORKSPACESTANDARDSUBDIRS            > Template Library;Dgnlib;Dgnlib/GUI;Dgnlib/Render;Dgnlib/DrawComp;Dgnlib/Links;Dgnlib/ClashDetection;Dgnlib/Printing
_USTN_WORKSPACESTANDARDSUBDIRS            > Dgnlib/Civil Cells;Dgnlib/Feature Definitions;Dgnlib/Sheet Seeds;Dgnlib/Graphical Filters;Dgnlib/Line Styles
_USTN_WORKSETSTANDARDSUBDIRS              = $(_USTN_WORKSPACESTANDARDSUBDIRS)

_USTN_WORKSPACETEMPLATE                   = $(_USTN_WORKSPACESROOT)Template/WorkSpace.Template
_USTN_WORKSETTEMPLATE                     = $(_USTN_WORKSPACESROOT)Template/WorkSet.Template
_USTN_WORKSETDGNWSTEMPLATE                = $(_USTN_WORKSPACESROOT)Template/WorkSetTemplate.dgnws

# Use Civil preference seeds only if supplied; otherwise keep app defaults.
%if exists ($(CIVIL_ORGANIZATION_ROOT)Preference Seeds/preferences.spf)
  MS_USERPREFSEED                         = $(CIVIL_ORGANIZATION_ROOT)Preference Seeds/preferences.spf
%endif
%if exists ($(CIVIL_ORGANIZATION_ROOT)Preference Seeds/group_panel_seed.xml)
  MS_GROUPPANELPREFSEED                   = $(CIVIL_ORGANIZATION_ROOT)Preference Seeds/group_panel_seed.xml
%endif
%if exists ($(CIVIL_ORGANIZATION_ROOT)Preference Seeds/docking_seed.xml)
  MS_DOCKINGPREFSEED                      = $(CIVIL_ORGANIZATION_ROOT)Preference Seeds/docking_seed.xml
%endif
%if exists ($(CIVIL_ORGANIZATION_ROOT)Preference Seeds/ribbon_seed.xml)
  MS_RIBBONPREFSSEED                      = $(CIVIL_ORGANIZATION_ROOT)Preference Seeds/ribbon_seed.xml
%endif
%if exists ($(CIVIL_ORGANIZATION_ROOT)Preference Seeds/function_keys_seed.mnu)
  MS_FKEYMNUSEED                         = $(CIVIL_ORGANIZATION_ROOT)Preference Seeds/function_keys_seed.mnu
%endif
MS_CONFIGURATIONOPTS = 
